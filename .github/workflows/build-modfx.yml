name: Build NTS-1 ModFX

on:
  push:
    paths:
      - 'effects/dust/**'
      - 'effects/carrier/**'
      - 'effects/vectorfilter/**'
      - 'effects/ironrot/**'
      - 'effects/attractor/**'
      - 'effects/zerocross/**'
      - 'effects/phasewell/**'
      - 'effects/ascender/**'
      - 'effects/helix/**'
      - 'effects/capstan/**'
      - 'effects/sideband/**'
      - 'effects/faultline/**'
      - '.github/workflows/build-modfx.yml'
  pull_request:
    paths:
      - 'effects/dust/**'
      - 'effects/carrier/**'
      - 'effects/vectorfilter/**'
      - 'effects/ironrot/**'
      - 'effects/attractor/**'
      - 'effects/zerocross/**'
      - 'effects/phasewell/**'
      - 'effects/ascender/**'
      - 'effects/helix/**'
      - 'effects/capstan/**'
      - 'effects/sideband/**'
      - 'effects/faultline/**'
      - '.github/workflows/build-modfx.yml'
  workflow_dispatch:

concurrency:
  group: modfx-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: dust, source: effects/dust/nts1 }
          - { name: carrier, source: effects/carrier/nts1 }
          - { name: vectorfilter, source: effects/vectorfilter/nts1 }
          - { name: ironrot, source: effects/ironrot/nts1 }
          - { name: attractor, source: effects/attractor/nts1 }
          - { name: zerocross, source: effects/zerocross/nts1 }
          - { name: phasewell, source: effects/phasewell/nts1 }
          - { name: ascender, source: effects/ascender/nts1 }
          - { name: helix, source: effects/helix/nts1 }
          - { name: capstan, source: effects/capstan/nts1 }
          - { name: sideband, source: effects/sideband/nts1 }
          - { name: faultline, source: effects/faultline/nts1 }

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi zip
      - name: Clone Korg logue SDK
        run: git clone --recursive --depth 1 https://github.com/korginc/logue-sdk.git
      - name: Prepare ${{ matrix.name }} project
        run: |
          cp -a logue-sdk/platform/nutekt-digital/dummy-modfx logue-sdk/platform/nutekt-digital/${{ matrix.name }}
          cp ${{ matrix.source }}/manifest.json logue-sdk/platform/nutekt-digital/${{ matrix.name }}/manifest.json
          cp ${{ matrix.source }}/project.mk logue-sdk/platform/nutekt-digital/${{ matrix.name }}/project.mk
          mkdir -p logue-sdk/platform/nutekt-digital/${{ matrix.name }}/src
          cp -a ${{ matrix.source }}/src/. logue-sdk/platform/nutekt-digital/${{ matrix.name }}/src/
      - name: Build ${{ matrix.name }}
        run: |
          cd logue-sdk/platform/nutekt-digital/${{ matrix.name }}
          make GCC_BIN_PATH=/usr/bin
          make GCC_BIN_PATH=/usr/bin install
          arm-none-eabi-size build/${{ matrix.name }}.elf
          ls -lh ${{ matrix.name }}.ntkdigunit
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp logue-sdk/platform/nutekt-digital/${{ matrix.name }}/${{ matrix.name }}.ntkdigunit artifacts/
          cp logue-sdk/platform/nutekt-digital/${{ matrix.name }}/build/${{ matrix.name }}.map artifacts/
          cp logue-sdk/platform/nutekt-digital/${{ matrix.name }}/build/${{ matrix.name }}.list artifacts/
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-nts1
          path: artifacts/
          if-no-files-found: error
